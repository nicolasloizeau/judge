[pytest]
testpaths = judge-core/tests judge-python/tests judge-lean/tests
# importlib mode: the packages' test directories share basenames (test_cli.py ...).
addopts = -ra --strict-markers --import-mode=importlib
markers =
    slow: needs Docker + the runsc runtime + a built image
filterwarnings =
    error
    # subprocess.Popen(preexec_fn=...) is how the local backend applies rlimits.
    ignore::DeprecationWarning:subprocess
