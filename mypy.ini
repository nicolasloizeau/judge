[mypy]
# No python_version pin: it must match the interpreter mypy runs under, because
# numpy's bundled stubs use 3.12+ syntax that older targets cannot parse.
mypy_path = judge-core/src:judge-python/src
namespace_packages = True
explicit_package_bases = True
strict = True
warn_unreachable = True
pretty = True

[mypy-tests.*]
disallow_untyped_defs = False

[mypy-numpy.*]
ignore_missing_imports = True
