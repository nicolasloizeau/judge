[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-lean"
version = "0.1.0"
description = "Lean-language support for judge: sandbox image, three-stage kernel-checked verification, adversarial fixtures, CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "judge-core==0.1.0",
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.scripts]
judge-lean = "judge.lean.cli:main"

[project.urls]
Homepage = "https://github.com/nicolasloizeau/judge"

[tool.setuptools.packages.find]
where = ["src"]
include = ["judge.lean*"]
namespaces = true

[tool.setuptools.package-data]
"judge.lean" = ["py.typed"]
