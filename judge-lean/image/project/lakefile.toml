# Lake project baked into the judge-lean image.
#
# Two things live here: Mathlib (as a dependency, so its prebuilt oleans end up
# on LEAN_PATH inside the image) and `judge-lean-check`, the trusted checker.
# The checker imports Lean core only -- never Mathlib -- so it builds in seconds
# and its trusted surface stays small.
#
# `lean-toolchain` pins the Lean version and `lake-manifest.json` pins the
# Mathlib commit; nothing here is ever resolved to "latest" at build time.
name = "judge-lean"
defaultTargets = ["judge-lean-check"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "JudgeLeanCheck"

[[lean_exe]]
name = "judge-lean-check"
root = "JudgeLeanCheck"
