[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-core"
version = "0.1.0"
description = "Language-agnostic sandboxed verification: budgets, verdicts, sandbox policy, backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nicolasloizeau/judge"

[tool.setuptools.packages.find]
where = ["src"]
include = ["judge.core*"]
namespaces = true

[tool.setuptools.package-data]
"judge.core" = ["py.typed"]
